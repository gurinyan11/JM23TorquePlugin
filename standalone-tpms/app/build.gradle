plugins { id 'com.android.application' }

android {
    namespace 'jp.jb23.tpmsplugin'
    compileSdk 35

    defaultConfig {
        applicationId 'jp.jb23.tpmsplugin'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1-torque-link'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Phase 0 deliberately has no USB transport or external dependencies.
